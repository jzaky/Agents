name: Repair Railway runner

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-runner.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand exact runner package into repository root
        shell: bash
        run: |
          set -euo pipefail

          archive="Actual-20-AI-Agents-Runner (2).zip"
          if [ ! -f "$archive" ]; then
            echo "Runner ZIP is missing: $archive" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"

          if [ ! -d "$tmp/actual-agent-runner/app" ]; then
            echo "Expected app/ folder was not found inside the runner ZIP." >&2
            exit 1
          fi

          cp -a "$tmp/actual-agent-runner/." .
          rm -f "$archive"
          rm -rf "$tmp"

          test -f Dockerfile
          test -f railway.json
          test -f app/main.py
          test -f app/registry.py
          test -f app/static/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi

          git commit -m "Fix Railway runner application files"
          git push
